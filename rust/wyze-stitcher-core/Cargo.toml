[package]
name = "wyze-stitcher-core"
version = "1.0.0"
edition = "2021"
description = "Portable lossless MP4 stitching engine for Wyze SD card recordings with UniFFI Swift bindings"

[lib]
name = "wyze_stitcher_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
mp4-merge = "0.1"
rayon = "1.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "fs", "time"] }
uniffi = { version = "0.28", features = ["tokio", "cli"] }
async-trait = "0.1"
thiserror = "2.0"
chrono = "0.4"
uuid = { version = "1.10", features = ["v4"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3.13"
